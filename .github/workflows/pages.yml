name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract and convert exact spider asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/Spider-Psionic assets/Spider-Psionic-runtime
          mkdir -p assets/Spider-Psionic assets/Spider-Psionic-runtime
          unzip -q assets/Spider-Psionic.zip -d assets/Spider-Psionic

          sudo apt-get update
          sudo apt-get install -y assimp-utils

          test -f assets/Spider-Psionic/spider.fbx
          assimp info assets/Spider-Psionic/spider.fbx

          (
            cd assets/Spider-Psionic
            assimp export spider.fbx ../Spider-Psionic-runtime/spider.glb -f glb2
          )

          test -s assets/Spider-Psionic-runtime/spider.glb
          ls -lh assets/Spider-Psionic/spider.fbx assets/Spider-Psionic-runtime/spider.glb

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
