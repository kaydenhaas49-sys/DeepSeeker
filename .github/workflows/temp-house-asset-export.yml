name: Temporary house asset export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-house-asset-export.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: house-interior-glb
          path: assets/house_interior.glb
