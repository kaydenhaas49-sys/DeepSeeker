name: Generate Bacteria Animations

on:
  push:
    paths:
      - "tools/make_bacteria_animations.py"
      - ".github/workflows/make-bacteria-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate animations
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python tools/make_bacteria_animations.py
          test -f assets/bacteria/generated/bacteria_idle.glb
          test -f assets/bacteria/generated/bacteria_stalk.glb
          test -f assets/bacteria/generated/bacteria_chase.glb
          test -f assets/bacteria/generated/bacteria_attack.glb

      - name: Commit generated GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bacteria/generated/*.glb
          git commit -m "Generate custom Bacteria animations"
          git push
