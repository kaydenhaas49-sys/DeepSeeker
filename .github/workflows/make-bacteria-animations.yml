name: Generate Bacteria Animations

on:
  push:
    paths:
      - "tools/make_bacteria_animations.py"
      - ".github/workflows/make-bacteria-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Generate animations
        run: blender --background --python tools/make_bacteria_animations.py

      - name: Commit generated GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bacteria/generated/*.glb
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git commit -m "Generate custom Bacteria animations"
          git push
