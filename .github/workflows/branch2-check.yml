name: Validate BRANCH2 JavaScript

on:
  push:
    branches: ["BRANCH2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(./*.js)
          if (( ${#sources[@]} == 0 )); then
            echo "No JavaScript modules were found."
            exit 1
          fi
          for source in "${sources[@]}"; do
            echo "Checking ${source}"
            node --input-type=module --check < "${source}"
          done
