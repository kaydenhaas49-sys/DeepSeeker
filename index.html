<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeepSeeker — Procedural Horror</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif}
#app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff9;box-shadow:0 0 5px #000;pointer-events:none;z-index:2}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.84);color:#d8c98a;cursor:pointer;user-select:none;z-index:10;text-align:center}
#overlay h1{margin:0;font-size:42px;letter-spacing:12px;font-weight:500;text-shadow:0 0 24px #d6be5a55}
#overlay .sub{margin:0;font-size:13px;letter-spacing:4px;color:#9a8d5e}
#overlay .prompt{margin:14px 0 0;font-size:17px;letter-spacing:3px;animation:pulse 1.6s ease-in-out infinite}
#overlay .controls{font-size:12px;letter-spacing:2px;color:#80774f;line-height:1.9}
#badge{position:fixed;left:16px;top:16px;padding:8px 11px;border:1px solid #fff2;border-radius:999px;background:#0008;color:#ddd;font-size:12px;z-index:2;pointer-events:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="app"></div>
<div id="badge">DEEPSEEKER • PROCEDURAL HORROR</div>
<div id="crosshair"></div>
<div id="overlay">
  <h1>DEEPSEEKER</h1>
  <p class="sub">PROCEDURAL LIMINAL HORROR</p>
  <p class="prompt" id="prompt">CLICK TO ENTER</p>
  <p class="controls">WASD — move &nbsp;•&nbsp; SHIFT — run &nbsp;•&nbsp; MOUSE — look<br>ESC — release cursor &nbsp;•&nbsp; Every seed makes a new map</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
